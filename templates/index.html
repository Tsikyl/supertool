<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Plans - Architecture</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: var(--surface);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -0.5px;
        }
        .drop-zone {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
            background: rgba(15, 23, 42, 0.5);
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: var(--text-muted); }
        input[type="number"], select {
            width: 100%; padding: 12px;
            background: var(--bg-dark);
            border: 1px solid #334155;
            color: white; border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }
        button {
            width: 100%; padding: 16px;
            background: var(--accent); color: #0f172a;
            border: none; border-radius: 8px;
            font-weight: 600; font-size: 16px; cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: transform 0.1s, opacity 0.3s;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        #preview-container { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 10px; }
        .preview-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #475569; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mise à l'échelle Batch</h1>
    <form id="uploadForm">
        <div class="drop-zone" id="dropZone">
            <span style="font-size: 24px; display: block; margin-bottom: 10px;">📄</span>
            Glissez vos plans ici ou cliquez<br>
            <span style="font-size: 12px; color: var(--text-muted);">PNG, JPG (Plusieurs fichiers supportés)</span>
            <input type="file" id="fileInput" name="files[]" accept="image/*" multiple style="display: none;">
        </div>
        
        <div id="preview-container"></div>

        <div class="grid-2">
            <div class="form-group">
                <label>Largeur totale (m)</label>
                <input type="number" name="largeur" value="9.0" step="0.1" required>
            </div>
            <div class="form-group">
                <label>Échelle (1:X)</label>
                <select name="echelle">
                    <option value="20">1/20è</option>
                    <option value="50" selected>1/50è</option>
                    <option value="100">1/100è</option>
                    <option value="200">1/200è</option>
                </select>
            </div>
        </div>
        
        <div class="form-group" style="margin-bottom: 25px;">
            <label>Format de sortie</label>
            <select name="format">
                <option value="A4">A4 (297 x 210 mm)</option>
                <option value="A3" selected>A3 (420 x 297 mm)</option>
                <option value="A2">A2 (594 x 420 mm)</option>
                <option value="A1">A1 (841 x 594 mm)</option>
            </select>
        </div>
        
        <button type="submit" id="submitBtn">Générer l'archive ZIP</button>
    </form>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const previewContainer = document.getElementById('preview-container');
    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault(); dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
        selectedFiles = Array.from(files);
        previewContainer.innerHTML = '';
        selectedFiles.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'preview-img';
                previewContainer.appendChild(img);
            }
            reader.readAsDataURL(file);
        });
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (selectedFiles.length === 0) return alert('Veuillez sélectionner au moins un fichier.');

        submitBtn.textContent = 'Traitement en cours...';
        submitBtn.style.opacity = '0.5';
        submitBtn.disabled = true;

        const formData = new FormData(form);
        // Les fichiers sont déjà liés via l'input form, mais on s'assure qu'ils sont bien passés
        
        try {
            const response = await fetch('/upload_batch', { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Erreur serveur');
            
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Plans_Architecture_Batch.zip";
            a.click();
            window.URL.revokeObjectURL(url);
        } catch (err) {
            alert(err.message);
        } finally {
            submitBtn.textContent = 'Générer l\'archive ZIP';
            submitBtn.style.opacity = '1';
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
